<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1c1f2b"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </radialGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a4b"/>
      <stop offset="50%" stop-color="#d90429"/>
      <stop offset="100%" stop-color="#9e001c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c99355"/>
      <stop offset="50%" stop-color="#f3c68f"/>
      <stop offset="100%" stop-color="#c99355"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#d90429" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Luxury Dark Emblem Base -->
  <rect x="4" y="4" width="232" height="232" rx="36" fill="url(#bgGrad)" stroke="url(#redGrad)" stroke-width="3"/>
  <rect x="12" y="12" width="216" height="216" rx="28" fill="none" stroke="rgba(224, 169, 109, 0.22)" stroke-width="1"/>

  <!-- Iconic SF Monogram -->
  <g filter="url(#glow)">
    <!-- S -->
    <path d="M 112 42 H 84 C 66 42 56 51 56 64 C 56 76 65 82 84 88 C 98 92 103 96 103 104 C 103 112 96 116 82 116 H 56 V 128 H 83 C 105 128 117 118 117 103 C 117 89 107 82 88 76 C 74 72 70 69 70 63 C 70 57 75 54 86 54 H 112 Z" fill="url(#redGrad)"/>
    <!-- F Top Bar (Detached Spartan Style) -->
    <rect x="126" y="42" width="60" height="12" rx="2" fill="url(#redGrad)"/>
    <!-- F Stem & Mid Bar -->
    <path d="M 126 74 H 176 V 86 H 140 V 128 H 126 Z" fill="url(#redGrad)"/>
  </g>

  <!-- S P A R T A (with signature double-bar T) -->
  <g fill="#ffffff" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="800" font-size="25" letter-spacing="10">
    <text x="30" y="164">SPAR</text>
  </g>
  <!-- Custom Double-Bar Spartan T -->
  <g fill="#ffffff">
    <rect x="163" y="145" width="18" height="3.5" rx="1"/>
    <rect x="163" y="152" width="18" height="3.5" rx="1"/>
    <rect x="170" y="152" width="4" height="12" rx="1"/>
  </g>
  <g fill="#ffffff" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="800" font-size="25">
    <text x="193" y="164">A</text>
  </g>

  <!-- Divider Lines + FITNESS -->
  <line x1="30" y1="184" x2="74" y2="184" stroke="url(#redGrad)" stroke-width="2" stroke-linecap="round"/>
  <text x="120" y="188" text-anchor="middle" fill="url(#goldGrad)" font-family="'Montserrat', sans-serif" font-weight="700" font-size="13" letter-spacing="3.5">FITNESS</text>
  <line x1="166" y1="184" x2="210" y2="184" stroke="url(#redGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- GYM OF GYMS -->
  <text x="120" y="210" text-anchor="middle" fill="#a0a6b5" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10.5" letter-spacing="4.5">GYM OF GYMS</text>
</svg>

